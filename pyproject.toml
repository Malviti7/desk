[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk"
version = "0.1.0"
description = "Personal trading desk: data, analytics, dashboard, and an MCP server for your agents."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "feedparser>=6.0",
  "yfinance>=0.2.40",
  "mcp>=1.9",
]

[project.optional-dependencies]
coinbase = ["coinbase-advanced-py>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
desk = "desk.cli:main"

[tool.setuptools.packages.find]
include = ["desk*"]
